[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tianzige"
version = "0.1.0"
description = "田字格练字帖生成器：输入文字，输出可打印的 A4 字帖，支持描红与米字格"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "teacher", "chinese", "handwriting", "worksheet", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
tianzige = "tianzige.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/tianzige"
Source = "https://github.com/eastyou/tianzige"

[tool.setuptools]
packages = ["tianzige"]
